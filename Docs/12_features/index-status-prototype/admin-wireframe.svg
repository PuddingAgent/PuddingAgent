  <rect x="48" y="462" width="134" height="26" rx="4" class="bld"/>
  <text x="56" y="479" class="s bldt">索引与检索　◀ 本页</text>
  <g class="s" fill="#4b5563">
    <text x="56" y="508">诊断</text>
    <text x="56" y="534">运行时</text>
    <text x="56" y="560">编排</text>
    <text x="56" y="586">工具审批</text>
    <text x="56" y="612">系统配置</text>
