  <rect x="40" y="48" width="1120" height="34" rx="8" fill="#eceff3" stroke="#c9ced6"/>
  <circle cx="58" cy="65" r="5" fill="#c9ced6"/><circle cx="74" cy="65" r="5" fill="#c9ced6"/><circle cx="90" cy="65" r="5" fill="#c9ced6"/>
  <text x="110" y="69" class="mono" fill="#4b5563">/index-status</text>
  <line x1="40" y1="82" x2="1160" y2="82" stroke="#c9ced6"/>

  <!-- 左侧菜单 -->
  <rect x="40" y="82" width="150" height="1054" class="panel"/>
  <text x="56" y="112" class="s" fill="#6b7280">Pudding Admin</text>
  <g class="s" fill="#4b5563">
    <text x="56" y="140">首页</text>
    <text x="56" y="166">对话</text>
    <text x="56" y="192">工作区</text>
    <text x="56" y="218">LLM 资源池</text>
    <text x="56" y="244">语音模型</text>
    <text x="56" y="270">Token 统计</text>
    <text x="56" y="296">智能体模板</text>
