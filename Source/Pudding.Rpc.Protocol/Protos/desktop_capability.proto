// Pudding Desktop 能力通道 —— 线上契约真源（wire truth）
//
// 设计依据：Docs/Features/Desktop-Contracts-Grpc-Capability-Plan-2026-10-01.md §5
//
// 方向约定（RPC 发起方向 ≠ 连接发起方向）：
//   Desktop ── 发起 Connect 双向流 ──────────────> Core
//           <── Command / Cancel ──────────────── Core Broker
//           ── Hello / Result / Event ───────────>
//
// 本文件是字段、编号、service 定义的唯一真源；生成的 C# 类型禁止手改。
// 领域接口/DTO 的真源在 Pudding.Contracts，两者的映射由 Pudding.DesktopConnection 负责。
//
// 兼容性纪律：已发布的字段号与 oneof 分支号永不重用；删除字段请用 reserved。

syntax = "proto3";

package pudding.capability.v1;

option csharp_namespace = "Pudding.Rpc.Protocol.V1";

import "google/protobuf/timestamp.proto";

// Desktop 侧能力服务。仅此一个 service：Desktop 主动拨入，Core 经响应流下发命令。
service DesktopCapability {
  rpc Connect(stream DesktopFrame) returns (stream CoreFrame);
}

// ── 握手与限制 ────────────────────────────────────────────────

// 双方支持的协议版本区间（闭区间）。
message ProtocolRange {
  uint32 minimum = 1;
  uint32 maximum = 2;
}

// 能力声明：线名 + 版本。线名真源为 Pudding.Contracts 的能力目录。
message CapabilityDeclaration {
  string capability = 1;
  uint32 version = 2;
}

// 通道限制。默认值只是起点，需压测确认（计划 §5）。
message ChannelLimits {
  uint32 max_frame_bytes = 1;
  uint32 max_in_flight_operations = 2;
  uint32 max_queued_bytes = 3;
  uint32 heartbeat_interval_ms = 4;
  uint32 heartbeat_timeout_ms = 5;
}

// Desktop → Core 的握手首帧。认证先于握手（传输层元数据），握手成功才开放调用。
message DesktopHello {
  string desktop_id = 1;
  string process_instance_id = 2;
  ProtocolRange supported_versions = 3;
  repeated CapabilityDeclaration capabilities = 4;
  uint32 requested_max_frame_bytes = 5;
}

// Core → Desktop 的握手回执。generation 用于让旧世代命令/结果失效。
message CoreHelloAck {
  string connection_id = 1;
  uint64 generation = 2;
  ProtocolRange negotiated_version = 3;
  repeated CapabilityDeclaration capabilities = 4;
  ChannelLimits limits = 5;
  string core_instance_id = 6;
}

// ── 命令 ─────────────────────────────────────────────────────

// 显式页面目标：禁止用「当前激活 Tab」隐式定位。
message CommandTarget {
  string context_id = 1;
  string page_id = 2;
}

message NavigateCommand {
  CommandTarget target = 1;
  string url = 2;
  // 期望的当前页面版本；0 = 不校验。
  int64 expected_page_version = 3;
}

message ExecuteJavascriptCommand {
  CommandTarget target = 1;
  // 脚本正文。审计与日志禁止记录本字段。
  string script = 2;
  int64 expected_page_version = 3;
  uint32 max_result_bytes = 4;
}

enum NotificationPriority {
  NOTIFICATION_PRIORITY_UNSPECIFIED = 0;
  NOTIFICATION_PRIORITY_LOW = 1;
  NOTIFICATION_PRIORITY_NORMAL = 2;
  NOTIFICATION_PRIORITY_HIGH = 3;
}

message ShowNotificationCommand {
  string title = 1;
  string message = 2;
  NotificationPriority priority = 3;
}

// 只读页面状态查询：Core 用它确认导航结果与 PageVersion，再决定后续交互。
message GetPageStateCommand {
  CommandTarget target = 1;
}

// 只读 Shell 状态查询：无参数（Shell 是窗口作用域，不接受调用方指定目标）。
message GetShellStatusCommand {
}

// 页面快照（切片 D）：Ref 只在同一 page_version 内有效。
message SnapshotCommand {
  CommandTarget target = 1;
  int64 expected_page_version = 2;
  SnapshotBudget budget = 3;
}

// 元素定位（切片 D）：v1 不支持复合定位（has）与跨帧选择（frame），线缆上无法表达。
message LocateCommand {
  CommandTarget target = 1;
  int64 expected_page_version = 2;
  LocatorSpec locator = 3;
  int32 max_results = 4;
}

// 定位策略 + 值 + 可选修饰；kind 用线名（ref/css/xpath/text/role/label/placeholder/alt-text/title/test-id）。
message LocatorSpec {
  string kind = 1;
  string value = 2;
  string name = 3;
  bool exact = 4;
  int32 nth = 5;
  string has_text = 6;
}

// 元素引用（按值元数据）：page_version 必须有效，交互提交后不得复用。
message ElementRef {
  string ref = 1;
  string tag = 2;
  string role = 3;
  string name = 4;
  string text = 5;
  bool visible = 6;
  bool enabled = 7;
  optional bool checked = 8;
  int64 page_version = 9;
}

// 元素交互（切片 D 唯一变更类能力）：必须固定 expected_page_version；
// 按 action 校验参数（fill/press 需 text，select 需 values，check/uncheck 需 checked，scroll 需非零 delta）。
message InteractCommand {
  CommandTarget target = 1;
  int64 expected_page_version = 2;
  string action = 3;
  LocatorSpec locator = 4;
  string text = 5;
  repeated string values = 6;
  optional bool checked = 7;
  double delta_x = 8;
  double delta_y = 9;
}

// 交互结果：受影响元素（可选）+ 交互后的页面状态（版本通常高于请求版本 ⇒ 旧 Ref 作废）。
message InteractionOutcome {
  ElementRef element = 1;
  PageStateOutcome page = 2;
}

// 条件等待（只读轮询）：timeout_ms 是硬上限；超时用 timed_out 标注，不是错误。
message WaitForCommand {
  CommandTarget target = 1;
  int64 expected_page_version = 2;
  string condition_kind = 3;
  string condition_value = 4;
  int32 timeout_ms = 5;
}

message WaitOutcome {
  bool timed_out = 1;
  string condition_kind = 2;
  string condition_value = 3;
  PageStateOutcome page = 4;
  string error = 5;
}

// 上下文与页面清单（只读，浏览器作用域）：先看清有什么，后续调用才能带上显式目标与版本。
message ContextsCommand {
}

message PageInfo {
  string context_id = 1;
  string page_id = 2;
  int64 page_version = 3;
  string title = 4;
  string url = 5;
  bool is_active = 6;
  bool is_agent_target = 7;
  bool can_go_back = 8;
  bool can_go_forward = 9;
  bool is_loading = 10;
}

message ContextInfo {
  string context_id = 1;
  string trust = 2;
  repeated PageInfo pages = 3;
}

message ContextsOutcome {
  repeated ContextInfo contexts = 1;
}

// 标签页操作（切片 D 收尾）：必须固定 expected_page_version；剩余清单复用 ContextsOutcome。
message TabsCommand {
  CommandTarget target = 1;
  int64 expected_page_version = 2;
  string action = 3;
}

message TabsOutcome {
  string action = 1;
  bool tab_closed = 2;
  PageStateOutcome page = 3;
  ContextsOutcome remaining = 4;
}

// 快照预算：Desktop 必须截断而不是无界返回；truncated 必须如实标注。
message SnapshotBudget {
  bool include_dom = 1;
  bool include_accessibility_tree = 2;
  bool include_html = 3;
  int32 max_nodes = 4;
  int32 max_text_length = 5;
}

// Core → Desktop 的能力命令。payload 用 oneof 白名单化，禁止「字符串命令名 + 任意 JSON」。
message CapabilityCommand {
  string operation_id = 1;
  // 命令所属连接世代；与当前世代不符必须拒绝。
  uint64 generation = 2;
  // 能力线名（Pudding.Contracts 目录值）。
  string capability = 3;
  string trace_id = 4;
  string correlation_id = 5;
  // 单操作期限（UTC）。长连接 deadline 不代替它。
  google.protobuf.Timestamp deadline = 6;

  oneof payload {
    NavigateCommand navigate = 10;
    ExecuteJavascriptCommand execute_javascript = 11;
    ShowNotificationCommand show_notification = 12;
    GetPageStateCommand get_page_state = 13;
    GetShellStatusCommand get_shell_status = 14;
    SnapshotCommand snapshot = 15;
    LocateCommand locate = 16;
    InteractCommand interact = 17;
    WaitForCommand wait_for = 18;
    ContextsCommand contexts = 19;
    TabsCommand tabs = 20;
  }
}

// Core → Desktop 的取消。尽力而为：不能撤销已执行的脚本。
message OperationCancel {
  string operation_id = 1;
  uint64 generation = 2;
  string reason = 3;
}

// ── 结果 ─────────────────────────────────────────────────────

enum NavigateDisposition {
  NAVIGATE_DISPOSITION_UNSPECIFIED = 0;
  // 请求已被接受，可能仍在加载。
  NAVIGATE_DISPOSITION_ACCEPTED = 1;
  // 导航本身已完成；仍不代表 DOM 可用于交互。
  NAVIGATE_DISPOSITION_COMPLETED = 2;
}

message NavigateOutcome {
  NavigateDisposition disposition = 1;
  string current_url = 2;
  int64 page_version = 3;
}

enum JavascriptValueKind {
  JAVASCRIPT_VALUE_KIND_UNSPECIFIED = 0;
  JAVASCRIPT_VALUE_KIND_UNDEFINED = 1;
  JAVASCRIPT_VALUE_KIND_NULL = 2;
  JAVASCRIPT_VALUE_KIND_BOOLEAN = 3;
  JAVASCRIPT_VALUE_KIND_NUMBER = 4;
  JAVASCRIPT_VALUE_KIND_STRING = 5;
  JAVASCRIPT_VALUE_KIND_JSON = 6;
}

message JavascriptOutcome {
  JavascriptValueKind kind = 1;
  // 裸 JSON 片段（字符串值带引号），避免二次 JSON 编码。
  string json_value = 2;
  bool truncated = 3;
}

message NotificationOutcome {
  bool shown = 1;
  string notification_id = 2;
}

// 页面状态结果（只读）：URL / 版本 / 就绪度。
// 就绪度用字符串线名（unknown / loading / interactive / complete / failed），
// 便于 Core 侧在不重新发版的情况下识别新状态。
message PageStateOutcome {
  string url = 1;
  int64 page_version = 2;
  string readiness = 3;
}

message SnapshotOutcome {
  string dom_text = 1;
  string accessibility_tree = 2;
  string html = 3;
  bool truncated = 4;
  int32 node_count = 5;
  int64 page_version = 6;
}

message LocateOutcome {
  repeated ElementRef elements = 1;
  bool truncated = 2;
  int64 page_version = 3;
}

// Shell 状态结果（只读）：窗口形态、托盘可见性、自动化状态与打开的页面数。
// 各状态用字符串线名（visible / hidden_to_tray / closing / unknown；free / paused / user_takeover），
// 便于 Core 在不重新发版的情况下识别 Desktop 新增状态。
message ShellStatusOutcome {
  string window_state = 1;
  bool tray_visible = 2;
  string automation_state = 3;
  uint32 open_page_count = 4;
}

// 领域错误（非流故障）。流本身故障使用 gRPC status。
message ErrorOutcome {
  // 线名真源：Pudding.Contracts 的 DesktopCapabilityErrorCodes。
  string code = 1;
  string message = 2;
  bool retryable = 3;
  bool may_have_side_effects = 4;
}

// Desktop → Core 的单次操作终态。终态结果不可丢（状态事件可合并）。
message OperationResult {
  string operation_id = 1;
  uint64 generation = 2;

  oneof outcome {
    NavigateOutcome navigate = 10;
    JavascriptOutcome execute_javascript = 11;
    NotificationOutcome show_notification = 12;
    ErrorOutcome error = 13;
    PageStateOutcome page_state = 14;
    ShellStatusOutcome shell_status = 15;
    SnapshotOutcome snapshot = 16;
    LocateOutcome locate = 17;
    InteractionOutcome interact = 18;
    WaitOutcome wait_for = 19;
    ContextsOutcome contexts = 20;
    TabsOutcome tabs = 21;
  }
}

// ── 事件与心跳 ────────────────────────────────────────────────

message PageStateChanged {
  CommandTarget target = 1;
  // unknown / loading / interactive / complete / failed
  string state = 2;
  int64 page_version = 3;
  string url = 4;
}

message ChannelStatusChanged {
  string state = 1;
  string detail = 2;
}

// Desktop → Core 的状态事件（可合并，不承载终态结果）。
message DesktopEvent {
  string event_id = 1;

  oneof payload {
    PageStateChanged page_state = 10;
    ChannelStatusChanged channel_status = 11;
  }
}

message Heartbeat {
  int64 sequence = 1;
}

message HeartbeatAck {
  int64 sequence = 1;
}

// ── 帧 ───────────────────────────────────────────────────────

// Desktop → Core。每条方向一个 reader、一个 writer；其他线程经有界队列汇聚。
message DesktopFrame {
  oneof frame {
    DesktopHello hello = 1;
    OperationResult result = 2;
    DesktopEvent event = 3;
    HeartbeatAck heartbeat_ack = 4;
  }
}

// Core → Desktop。
message CoreFrame {
  oneof frame {
    CoreHelloAck hello_ack = 1;
    CapabilityCommand command = 2;
    OperationCancel cancel = 3;
    Heartbeat heartbeat = 4;
  }
}
